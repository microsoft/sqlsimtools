name: Bug report
description: Report a reproducible defect in sqlsim, sqlpysim, or sqlsim Studio
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow
        [SECURITY.md](https://github.com/microsoft/sqlsimtools/blob/main/SECURITY.md)
        to report privately to the Microsoft Security Response Center.

        Redact servers, user names, passwords, tokens, and connection strings
        from everything you paste below.

  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - sqlsim
        - sqlpysim
        - sqlsim Studio
        - Release packaging, docs, or agent guidance
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `sqlsim --version` or `sqlpysim --version`, or the release tag or commit you built from.
      placeholder: v1.0.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows x64
        - Windows ARM64
        - Ubuntu x64
        - Ubuntu ARM64
        - macOS ARM64
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: SQL target
      options:
        - SQL Server 2019
        - SQL Server 2022
        - SQL Server 2025
        - Azure SQL Database
        - Azure SQL Managed Instance
        - SQL database in Microsoft Fabric
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: auth
    attributes:
      label: Authentication mode
      options:
        - "-E (Windows integrated)"
        - "-A (Microsoft Entra)"
        - "-T (access token)"
        - "-U / -P (SQL authentication)"
        - "-c (connection string)"
    validations:
      required: true

  - type: input
    id: driver
    attributes:
      label: Driver version
      description: ODBC driver build for sqlsim, or the mssql-python package version for sqlpysim. See DRIVER-COMPATIBILITY.md.
      placeholder: msodbcsql18 18.7.1.1

  - type: textarea
    id: repro
    attributes:
      label: Command that reproduces the problem
      description: Include the full command line with secrets removed.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error text, and the JSON results file from -json / -o when available.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Thread and iteration counts, workload JSON, or anything else that helps reproduce the behavior.