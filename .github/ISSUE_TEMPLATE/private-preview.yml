name: Request Private Preview access
description: Ask to test a platform that is in invitation-only Private Preview
title: "Private Preview request: "
labels: ["preview-request"]
body:
  - type: markdown
    attributes:
      value: |
        Some sqlsimtools platforms are in an invitation-only Private Preview
        while platform testing continues. See the Preview status table in
        [RELEASE-NOTES.md](https://github.com/microsoft/sqlsimtools/blob/main/RELEASE-NOTES.md).

        **This request is public.** Access is granted to your GitHub account,
        so we do not need your email address, employer, or any contact details.
        Do not include them, or any confidential information about your
        environment or data.

        If you are accepted, a maintainer invites your GitHub username to the
        repository where preview builds are shared and closes this issue.
        Invitations depend on current testing needs and are not guaranteed.

  - type: checkboxes
    id: preview
    attributes:
      label: Preview builds you want to test
      description: Select all preview builds you want to test.
      options:
        - label: sqlsim on macOS ARM64
        - label: sqlpysim on macOS ARM64
        - label: sqlsim Studio on Ubuntu 24.04/26.04 LTS x64
        - label: sqlsim Studio on Windows ARM64
        - label: sqlsim Studio on macOS ARM64

  - type: checkboxes
    id: target
    attributes:
      label: SQL targets you can test against
      description: Select all SQL targets you can test against.
      options:
        - label: SQL Server 2019
        - label: SQL Server 2022
        - label: SQL Server 2025
        - label: Azure SQL Database
        - label: Azure SQL Managed Instance
        - label: SQL database in Microsoft Fabric

  - type: checkboxes
    id: auth
    attributes:
      label: Authentication you can test
      description: Select all authentication methods you can test.
      options:
        - label: Windows or Kerberos integrated
        - label: Microsoft Entra
        - label: Access token
        - label: SQL authentication

  - type: textarea
    id: scenario
    attributes:
      label: What you want to test
      description: A short, non-confidential description, for example "Compare sqlsim throughput on an Apple Silicon laptop against Azure SQL Database."
    validations:
      required: true

  - type: checkboxes
    id: understanding
    attributes:
      label: Before you submit
      options:
        - label: This request contains no email address, employer details, or other confidential information.
          required: true
        - label: I understand Private Preview builds are unsupported and that I can share feedback through GitHub issues.
          required: true
