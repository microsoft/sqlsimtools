name: sqlsimtools macOS ARM64 Private Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sqlsim-macos-arm64-private-preview.yml'
      - 'sqlsim/**'
      - 'sqlpysim/**'
      - 'sqlsimstudio/**'
      - 'release/**'
      - '.github/skills/sqlsim/**'
      - '.github/skills/sqlpysim/**'
      - '.github/skills/sqlsimstudio/**'
      - '.github/agents/sqlsimtools-workload-builder.agent.md'

permissions:
  contents: read

jobs:
  build-macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm Apple Silicon runner
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          sw_vers

      - name: Install build prerequisites
        run: brew install cmake unixodbc openssl pandoc

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Python driver
        working-directory: sqlpysim
        run: python -m pip install -r requirements.txt

      - name: Build and test sqlsim
        working-directory: sqlsim
        run: |
          bash ./build-macos.sh --clean
          bash ./smoke-test-macos.sh --skip-build

      - name: Stage sqlsim
        working-directory: sqlsim
        run: |
          bash ./publish-macos.sh --skip-build --release-dir '${{ runner.temp }}/stage/sqlsim'

      - name: Stage sqlpysim
        working-directory: sqlpysim
        shell: pwsh
        run: |
          ./publish.ps1 -ReleaseDir '${{ runner.temp }}/stage/sqlpysim'
          if ($LASTEXITCODE -ne 0) { throw 'sqlpysim publishing failed.' }

      - name: Build Studio with both engines
        working-directory: sqlsimstudio
        shell: pwsh
        run: |
          ./build.ps1 -Runtime osx-arm64
          if ($LASTEXITCODE -ne 0) { throw 'Studio publishing failed.' }

      - name: Create and extract candidate archives
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/verify"
          printf 'Commit: %s\nBuild: %s\nPlatform: macOS 15+ ARM64\nValidation: offline only; live SQL testing required\n' \
            "$CANDIDATE_SHA" "$CANDIDATE_RUN" > "$RUNNER_TEMP/artifacts/BUILD-INFO.txt"
          for tool in sqlsim sqlpysim sqlsimstudio; do
            stage="$RUNNER_TEMP/stage/$tool"
            if [[ "$tool" == "sqlsimstudio" ]]; then
              stage="$GITHUB_WORKSPACE/sqlsimstudio/build/osx-arm64"
            fi
            cp "$RUNNER_TEMP/artifacts/BUILD-INFO.txt" "$stage/BUILD-INFO.txt"
            archive="$RUNNER_TEMP/artifacts/$tool-macos-arm64-private-preview.tar.gz"
            tar -C "$stage" -czf "$archive" .
            mkdir -p "$RUNNER_TEMP/verify/$tool"
            tar -C "$RUNNER_TEMP/verify/$tool" -xzf "$archive"
          done
          cd "$RUNNER_TEMP/artifacts"
          shasum -a 256 ./*.tar.gz > SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Validate extracted CLI packages
        shell: pwsh
        run: |
          ./release/validate-package-layout.ps1 `
            -InstallRoot '${{ runner.temp }}/verify/sqlsim' `
            -Tool sqlsim `
            -SqlsimExecutable 'sqlsim/arm64/sqlsim'
          if ($LASTEXITCODE -ne 0) { throw 'sqlsim archive validation failed.' }
          ./release/validate-package-layout.ps1 `
            -InstallRoot '${{ runner.temp }}/verify/sqlpysim' `
            -Tool sqlpysim
          if ($LASTEXITCODE -ne 0) { throw 'sqlpysim archive validation failed.' }

      - name: Validate extracted Studio package
        shell: pwsh
        run: |
          $studio = '${{ runner.temp }}/verify/sqlsimstudio'
          foreach ($path in @(
            'sqlsimstudio', 'sqlsim/sqlsim', 'sqlpysim/sqlpysim.py',
            'sqlpysim/requirements.txt', 'LICENSE', 'THIRD-PARTY-NOTICES.md',
            'sqlsimstudio.md', 'sqlsimstudio.html', 'CONFIGURATION.md',
            'MACOS-PRIVATE-PREVIEW.md', 'examples',
            '.github/skills/sqlsimstudio/SKILL.md', 'BUILD-INFO.txt'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $studio $path))) {
              throw "Studio archive is missing $path"
            }
          }
          & lipo -verify_arch arm64 (Join-Path $studio 'sqlsimstudio')
          if ($LASTEXITCODE -ne 0) { throw 'Studio is not an ARM64 executable.' }
          & lipo -verify_arch arm64 (Join-Path $studio 'sqlsim/sqlsim')
          if ($LASTEXITCODE -ne 0) { throw 'Bundled sqlsim is not an ARM64 executable.' }
          & (Join-Path $studio 'sqlsim/sqlsim') --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled sqlsim could not start.' }
          & python (Join-Path $studio 'sqlpysim/sqlpysim.py') --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled sqlpysim could not start.' }
          Push-Location sqlsimstudio
          try {
            ./smoke-test.ps1 -SkipBuild -StartupOnly `
              -StudioExecutable (Join-Path $studio 'sqlsimstudio')
            if ($LASTEXITCODE -ne 0) { throw 'Studio startup smoke test failed.' }
          } finally {
            Pop-Location
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlsimtools-macos-arm64-private-preview
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
